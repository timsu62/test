name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
      timezone: "America/Toronto"

permissions:
  contents: read

concurrency:
  group: toronto-housing-ingestion
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

      - run: pytest -q --cov=toronto_housing_ingestion --cov-report=term-missing

      - name: Run SCD2 integration tests
        run: python -m pytest -q tests/test_dlt_integration.py

      - name: Run live fallback integration tests
        if: github.event_name != 'pull_request'
        env:
          RUN_LIVE_TESTS: "1"
        run: python -m pytest -q tests/test_live_fallbacks.py

      - run: pip-audit
      - run: python -m build

  data-assets:
    name: Extract Toronto data and publish assets
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -e .

      - name: Install pytest
        run: python -m pip install "pytest>=9,<10"

      - name: Restore persistent DuckDB asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/warehouse
          if gh release view warehouse-latest >/dev/null 2>&1; then
            gh release download warehouse-latest --pattern "toronto.duckdb" --dir data/warehouse --clobber
          fi

      - name: Extract all five configured sources
        run: >-
          toronto-ingest
          --config open_data_config.yml
          --raw-root data/raw
          --manifest-root data/manifests
          --checkpoint-root data/checkpoints
          --lock-file data/.ingestion.lock
          --full-refresh

      - name: Run local setup smoke test
        env:
          RUN_LIVE_TESTS: "1"
        run: python -m pytest -q tests/test_local_setup.py

      - name: Validate assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find data/raw -type f -name 'data.parquet' | wc -l)" -eq 5
          test -s data/warehouse/toronto.duckdb
          for file in $(find data/raw -type f -name 'data.parquet'); do
            test -s "$file"
          done

          echo "Parquet assets:"
          find data/raw -type f -name 'data.parquet' -print

          echo "DuckDB:"
          ls -lh data/warehouse/toronto.duckdb

      - name: Run permit business-key tests
        run: python -m pytest -q tests/test_business_keys.py

      - name: Upload Parquet assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7
        with:
          name: toronto-parquet-${{ github.run_id }}
          path: data/raw/**/*.parquet
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload DuckDB asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7
        with:
          name: toronto-duckdb-${{ github.run_id }}
          path: data/warehouse/toronto.duckdb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Persist DuckDB release asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view warehouse-latest >/dev/null 2>&1; then
            gh release upload warehouse-latest data/warehouse/toronto.duckdb --clobber
          else
            gh release create warehouse-latest data/warehouse/toronto.duckdb \
              --title "Persistent DuckDB warehouse" \
              --notes "Mutable data asset maintained by CI; this release is the project's persistent DuckDB state." \
              --latest=false
          fi
